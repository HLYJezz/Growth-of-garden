<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Growth of Garden · สวนของเรา</title>
<style>
/* ============================================================
   GROWTH OF GARDEN — scaffold
   Single-file bilingual wellbeing check-in.
   Swap real content in the marked >>> PLACEHOLDER <<< blocks.
   ============================================================ */

/* ---- fonts (Thai + English storybook pairing) ---- */
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&display=swap');

:root{
  --bg-a:#dff0e6; --bg-b:#cfe6dd; --bg-c:#f3ecd9;
  --ink:#3a4a42; --ink-soft:#5f7168;
  --card:rgba(255,255,255,.62);
  --card-line:rgba(255,255,255,.75);
  --accent:#7fb59a; --accent-deep:#5c9a7d;
  --sun:#f2c265; --rain:#8fb4d4; --autumn:#cf9b5f; --bloom:#e79bb4;
  --shadow:0 12px 34px rgba(60,90,75,.20);
  --radius:26px;
  --font-th:'Mali',sans-serif;
  --font-en:'Quicksand',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-th);
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));
  overflow:hidden;
  user-select:none;
}
body.en{font-family:var(--font-en)}

#app{
  position:relative;
  height:100dvh;
  width:100%;
  max-width:440px;
  margin:0 auto;
  overflow:hidden;
  box-shadow:0 0 60px rgba(60,90,75,.18);
}
/* The painting sits on its own layer beneath the ambient petals (z1) and the
   screens (z2). Separating it from #app is what allows the story to scale the
   art without scaling the text laid over it. */
#bgLayer{
  position:absolute; inset:0; z-index:0;
  background-size:cover;
  background-position:center;
  /* No transition here on purpose. background-image is a DISCRETE property —
     transitioning it buys no cross-fade and actively held the layer on the old
     scene, so walk pages kept showing the gate whatever setBg() wrote. */
}
/* phone-only base: frame the column on wider screens */
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;padding:0}
  #app{height:min(100dvh,900px);border-radius:28px}
}

/* ---- ambient drifting petals ----
   Drawn shapes in the app's own palette, not emoji, so nothing can clash with
   the gouache art. Two nested animations: the outer element falls, the inner
   one sways and turns. That second axis is what reads as drifting rather than
   dropping — a single translateY looks like a stone on a rail. */
.ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.petal{position:absolute;top:-8%;animation:petalFall linear infinite}
.petal .sway{display:block;animation:petalSway ease-in-out infinite alternate}
.petal .shape{display:block;border-radius:52% 0 52% 0}
@keyframes petalFall{
  0%{transform:translateY(-8%);opacity:0}
  8%{opacity:1}
  88%{opacity:1}
  100%{transform:translateY(112dvh);opacity:0}
}
@keyframes petalSway{
  from{transform:translateX(-13px) rotate(-24deg)}
  to{transform:translateX(13px) rotate(26deg)}
}
@media (prefers-reduced-motion: reduce){
  .petal,.petal .sway{animation:none}
}

/* ---- generic screen ---- */
.screen{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:26px 22px;
  opacity:0;pointer-events:none;
  transition:opacity .45s ease;
}
.screen.active{opacity:1;pointer-events:auto}
#result.active{overflow-y:auto;justify-content:flex-start;padding-top:44px;padding-bottom:60px}
/* intro + story pages stay centered like paper notes */
#intro.active,#story.active{justify-content:center}
/* soft dark scrim at the bottom so text reads over any art */
#story::after,#walk::after{content:'';position:absolute;left:0;right:0;top:0;bottom:0;
  background:radial-gradient(ellipse 90% 55% at 50% 50%,rgba(247,244,238,.82),rgba(247,244,238,.30) 70%,transparent);
  z-index:1;pointer-events:none}
#walkQ::after{display:none}

/* ---- frosted card (result + paper intro) ---- */
.card{
  background:var(--card);
  border:1px solid var(--card-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 24px;
  width:100%;
  text-align:center;
}
/* ---- paper-note card for intro/story pages ---- */
.consent-note{background:var(--paper,#fdf9f0);border:1px solid var(--card-line);border-radius:18px;
  padding:22px 20px;text-align:left;max-width:400px;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.consent-title{font-size:19px;font-weight:700;margin-bottom:14px;text-align:center;color:var(--accent-deep);white-space:pre-line}
.consent-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.consent-list li{font-size:14.5px;line-height:1.6;padding-left:20px;position:relative}
.consent-list li::before{content:'';position:absolute;left:1px;top:.62em;
  width:9px;height:9px;background:var(--accent);border-radius:52% 0 52% 0;opacity:.85}
.consent-btns{display:flex;flex-direction:column;gap:8px;align-items:center}
.consent-decline{background:none;border:none;font-size:13.5px;color:var(--muted,#8a8579);text-decoration:underline;padding:6px}
.demo-block{margin-bottom:18px}
.demo-label{font-size:14.5px;font-weight:700;margin-bottom:8px;color:var(--accent-deep)}
.demo-opts{display:flex;flex-wrap:wrap;gap:8px}
.demo-opt{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);
  border-radius:40px;padding:9px 16px;font-size:14px;line-height:1.3;
  text-align:center;cursor:pointer;transition:all .15s ease;color:var(--ink);
  box-shadow:0 4px 12px rgba(60,90,75,.14)}
.demo-opt:active{transform:scale(.97)}
.demo-opt.sel{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent}
.note{
  position:relative;z-index:3;
  background:rgba(252,250,244,.94);
  border-radius:14px;
  box-shadow:0 14px 40px rgba(60,70,50,.28), inset 0 0 0 1px rgba(120,110,90,.15);
  padding:30px 26px;width:100%;max-width:340px;text-align:center;
}
.note::before,.note::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;
  background:rgba(90,80,60,.35);top:16px}
.note::before{left:18px}
.note::after{right:18px}

/* ---- top progress bar ---- */
.progress{position:absolute;top:14px;left:22px;right:22px;height:7px;border-radius:20px;
  background:rgba(255,255,255,.55);z-index:8;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);
  opacity:0;transition:opacity .4s}
.progress.show{opacity:1}
.progress-fill{height:100%;width:0;border-radius:20px;
  background:linear-gradient(90deg,var(--accent),var(--accent-deep));transition:width .5s cubic-bezier(.3,1,.4,1)}

/* ---- keeper character ---- */
.keeper{
  display:none;
  width:96px;height:96px;border-radius:50%;
  object-fit:cover;
  filter:drop-shadow(0 0 16px rgba(242,194,101,.75));
  animation:bob 4s ease-in-out infinite;
}
.keeper.mini{width:52px;height:52px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
/* same motion, for elements that are centred with translateX(-50%) */
@keyframes bobX{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}

/* ---- intro ---- */
#intro .keeper{margin-bottom:14px}
.title{font-family:var(--font-en);font-weight:700;font-size:30px;letter-spacing:.5px;color:var(--accent-deep)}
.subtitle{font-size:15px;color:var(--ink-soft);margin-top:6px}
.lead{font-size:17px;line-height:1.7;margin:18px 0 10px}
.caption{font-size:12.5px;color:var(--ink-soft);opacity:.9}

/* ---- buttons ---- */
.btn{
  font-family:var(--font-en);font-weight:600;font-size:16px;
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  border:none;border-radius:40px;
  padding:13px 30px;margin-top:20px;
  cursor:pointer;box-shadow:0 8px 20px rgba(92,154,125,.4);
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.4);color:var(--accent-deep);box-shadow:none;border:1px solid var(--card-line)}

/* ---- narration: text laid over the art ---- */
.bubble-wrap{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.bubble{
  font-size:18px;line-height:1.85;color:var(--ink);
  text-align:center;width:100%;white-space:pre-line;
  text-shadow:0 1px 10px rgba(247,244,238,.9),0 1px 2px rgba(247,244,238,1);
  padding:0 4px;
}
#story .bubble{font-size:17px;line-height:1.8}
.tap-hint{font-family:var(--font-en);font-size:13px;color:var(--ink-soft);opacity:0;pointer-events:none}
.tap-hint.reveal{animation:hintIn 1.6s ease-out 2s forwards, blink 2.6s ease-in-out 3.6s infinite}
@keyframes hintIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* ---- question: prompt + pill options over art ---- */
#walkQ{position:relative;z-index:3;background:none;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;width:100%;text-align:center}
.qhead{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.prompt{font-size:18px;line-height:1.65;margin-bottom:4px;
  text-shadow:0 1px 10px rgba(247,244,238,.9),0 1px 2px rgba(247,244,238,1)}
.opts{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:6px}
.opt{
  background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);
  border-radius:40px;padding:15px 20px;font-size:15.5px;line-height:1.45;
  text-align:center;cursor:pointer;transition:all .15s ease;color:var(--ink);
  box-shadow:0 6px 18px rgba(60,90,75,.16);backdrop-filter:blur(4px)
}
.opt:active{transform:scale(.98)}
.opt.sel{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent}

/* ---- result ---- */
.r-title{font-family:var(--font-en);font-weight:700;font-size:27px;margin-bottom:2px}
.r-sub{font-size:15px;color:var(--ink-soft);margin-bottom:16px}
.scene{
  position:relative;width:100%;height:210px;margin:6px 0 14px;
  border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,#eaf5ee,#dcecdf);
  border:1px solid var(--card-line);
}
.scene .soil{position:absolute;left:0;right:0;bottom:0;width:100%}
/* bobX, not bob: an animation's transform replaces the rule's transform, so
   plain `bob` wiped out translateX(-50%) and shoved the tree half its own
   width to the right. The centring has to live inside the keyframes. */
.scene .tree{position:absolute;left:50%;bottom:18%;height:70%;animation:bobX 5s ease-in-out infinite}
.scene .fl{position:absolute;bottom:14%;height:26px;animation:bob 4s ease-in-out infinite}
.r-summary{font-size:16px;line-height:1.7;margin:6px 4px 16px}
.cute-quote{font-size:16px;line-height:1.6;text-align:center;color:var(--accent-deep);background:rgba(255,255,255,.55);border:1px solid var(--card-line);border-radius:18px;padding:14px 16px;margin:0 2px 16px;font-weight:600}
.box{background:rgba(255,255,255,.5);border:1px solid var(--card-line);border-radius:18px;padding:16px 18px;text-align:left;margin-bottom:14px}
.box h4{font-family:var(--font-en);font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent-deep);margin-bottom:8px}
.box ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.box li{font-size:15px;line-height:1.5;padding-left:18px;position:relative}
/* drawn bullets, matching .consent-list — leaf for advice, round bud for the
   key message so the two lists stay visually distinct without emoji */
.box li::before{content:'';position:absolute;left:1px;top:.55em;
  width:9px;height:9px;background:var(--accent);border-radius:52% 0 52% 0;opacity:.85}
.box.key li::before{background:var(--sun);border-radius:50%;opacity:.95}
.keymsg{font-size:15.5px;line-height:1.7;white-space:pre-line}
.r-summary{white-space:pre-line}

/* ---- score bars ---- */
.bars{display:flex;flex-direction:column;gap:12px;margin:4px 0 16px;width:100%}
.bar-row{display:flex;flex-direction:column;gap:5px}
.bar-top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft)}
.bar-track{height:9px;border-radius:20px;background:rgba(92,154,125,.16);overflow:hidden}
.bar-fill{height:100%;border-radius:20px;width:0;transition:width .9s cubic-bezier(.3,1,.4,1)}

/* ---- support box (conditional) ---- */
.support{background:rgba(143,180,212,.16);border:1px solid rgba(143,180,212,.4)}
.support h4{color:#5a86a8}

/* ---- disclaimer ---- */
.disclaimer{font-size:11.5px;color:var(--ink-soft);opacity:.8;line-height:1.6;margin-top:10px;text-align:center;padding:0 4px}

/* ---- top controls ---- */
.topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;padding:14px 16px;pointer-events:none}
.topbar > *{pointer-events:auto}
.pill{font-family:var(--font-en);font-size:13px;font-weight:600;background:rgba(255,255,255,.55);border:1px solid var(--card-line);border-radius:30px;padding:7px 12px;cursor:pointer;color:var(--ink);backdrop-filter:blur(8px)}
/* icon-only button — no display rule here on purpose: visibility is driven by
   the inline style, and a CSS display:none would win once JS clears it. */
#muteBtn{padding:7px 10px;line-height:0}
#muteBtn svg{display:block}
.left-ctrls{display:flex;gap:8px}

/* ---- scroll hint ---- */
.scrollhint{position:absolute;bottom:16px;left:50%;z-index:6;font-size:22px;color:var(--accent-deep);animation:bobX 1.6s ease-in-out infinite;transition:opacity .4s;pointer-events:none}

</style>
</head>
<body>
<div id="app">

  <!-- the painting lives on its own layer so it can be scaled independently of
       the text on top of it — that's what lets the story push into the gate -->
  <div id="bgLayer"></div>

  <!-- top controls -->
  <div class="topbar">
    <button class="pill" id="muteBtn" style="display:none" aria-label="Mute"></button>
    <button class="pill" id="langBtn">EN</button>
  </div>

  <div class="ambient" id="ambient"></div>

  <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>

  <!-- ============ INTRO ============ -->
  <section class="screen" id="intro">
    <div class="note">
    <img class="keeper" id="introKeeper" alt="" style="margin-bottom:8px">
      <div class="title" id="introTitle"></div>
      <div class="subtitle" id="introSub"></div>
      <div class="lead" id="introLead"></div>
      <div class="caption" id="introCaption"></div>
      <button class="btn" id="startBtn"></button>
    </div>
    </div>
  </section>

  <!-- ============ STORY ============ -->
  <section class="screen" id="story">
    <div class="bubble-wrap">
      <img class="keeper" id="storyKeeper" alt="">
      <div class="bubble" id="storyBubble"></div>
      <div class="tap-hint" id="storyHint"></div>
      <button class="btn" id="storyBegin" style="display:none"></button>
    </div>
  </section>

  <!-- ============ CONSENT ============ -->
  <section class="screen" id="consent">
    <div class="consent-note">
      <div class="consent-title" id="consentTitle"></div>
      <ul class="consent-list" id="consentList"></ul>
      <div class="consent-btns">
        <button class="btn" id="consentAgree"></button>
        <button class="consent-decline" id="consentDecline"></button>
      </div>
    </div>
  </section>

  <!-- ============ DEMOGRAPHICS ============ -->
  <section class="screen" id="demo">
    <div class="consent-note">
      <div class="consent-title" id="demoTitle"></div>

      <div class="demo-block">
        <div class="demo-label" id="demoAgeLabel"></div>
        <div class="demo-opts" id="demoAgeOpts"></div>
      </div>

      <div class="demo-block">
        <div class="demo-label" id="demoYearLabel"></div>
        <div class="demo-opts" id="demoYearOpts"></div>
      </div>

      <div class="demo-block">
        <div class="demo-label" id="demoGenderLabel"></div>
        <div class="demo-opts" id="demoGenderOpts"></div>
      </div>

      <div class="consent-btns">
        <button class="btn" id="demoContinue"></button>
      </div>
    </div>
  </section>

  <!-- ============ WALK ============ -->
  <section class="screen" id="walk">
    <!-- narration sub-view -->
    <div class="bubble-wrap" id="walkNarr">
      <img class="keeper" id="walkKeeper" alt="">
      <div class="bubble" id="walkBubble"></div>
      <div class="tap-hint" id="walkHint"></div>
      <button class="btn" id="walkReveal" style="display:none"></button>
    </div>
    <!-- question sub-view -->
    <div class="card" id="walkQ" style="display:none">
      <div class="qhead">
        <img class="keeper mini" id="qKeeper" alt="">
      </div>
      <div class="prompt" id="qPrompt"></div>
      <div class="opts" id="qOpts"></div>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="screen" id="result">
    <div class="card">
      <div class="r-title" id="rTitle"></div>
      <div class="r-sub" id="rSub"></div>
      <div class="scene" id="rScene"></div>
      <div class="r-summary" id="rSummary"></div>
      <div class="cute-quote" id="rQuote"></div>

      <div class="box" id="rCharBox">
        <h4 id="rCharLabel"></h4>
        <ul id="rChar"></ul>
      </div>

      <div class="box key">
        <h4 id="rKeyLabel"></h4>
        <div class="keymsg" id="rKey"></div>
      </div>

      <div class="bars" id="rBars"></div>

      <div class="box support" id="rSupport" style="display:none">
        <h4 id="rSupportLabel"></h4>
        <div class="keymsg" id="rSupportText"></div>
      </div>

      <button class="btn" id="saveBtn"></button>
      <button class="btn ghost" id="restartBtn"></button>

      <div class="disclaimer" id="rDisclaimer"></div>
    </div>
  </section>

  <div class="scrollhint" id="scrollHint">⌄</div>

</div>

<script>
/* ================================================================
   ART PLACEHOLDERS (small, inline)
   Tiny generated SVGs stand in for the keeper, trees and flowers.
   They stay inline because they cost only a few hundred bytes each.
   >>> Replace with real watercolor art when it's ready. <<<
   Anything heavy (music, painted backgrounds) goes on the CDN
   instead — see REMOTE ASSETS below.
   ================================================================ */
/* Colours below are the literal palette values from :root. They can't be var()
   references because these strings become standalone SVG documents. */
const svgUri = (s)=> "data:image/svg+xml;utf8," + encodeURIComponent(s);

/* The keeper: a sprout, not a character — art direction is "no people". */
const KEEPER_IMG = svgUri(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'>"+
  "<circle cx='60' cy='60' r='60' fill='#dfeee4'/>"+
  "<path d='M60 96 V54' stroke='#5c9a7d' stroke-width='7' stroke-linecap='round'/>"+
  "<path d='M60 70 C40 70 30 58 30 46 c16 0 30 10 30 24z' fill='#7fb59a'/>"+
  "<path d='M60 62 C80 62 90 48 90 36 c-16 0 -30 12 -30 26z' fill='#5c9a7d'/>"+
  "<circle cx='60' cy='30' r='8' fill='#f2c265'/>"+
  "</svg>");

const soilArt = svgUri(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 70'>"+
  "<rect width='400' height='70' fill='#b98d63'/>"+
  "<rect width='400' height='14' fill='#7faf83'/>"+
  "</svg>");

/* One naive folk-art tree, recoloured per season. Overlapping ellipses instead
   of an outline keeps it closer to the gouache direction than a line drawing. */
const treeArt = (mid, light, dark, extra)=> svgUri(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 140 180'>"+
  "<path d='M70 178 V104' stroke='#a9855f' stroke-width='12' stroke-linecap='round'/>"+
  "<path d='M70 132 L48 112' stroke='#a9855f' stroke-width='7' stroke-linecap='round'/>"+
  "<path d='M70 122 L94 102' stroke='#a9855f' stroke-width='7' stroke-linecap='round'/>"+
  "<ellipse cx='70' cy='68' rx='54' ry='46' fill='"+mid+"'/>"+
  "<ellipse cx='44' cy='84' rx='27' ry='23' fill='"+light+"'/>"+
  "<ellipse cx='98' cy='80' rx='25' ry='21' fill='"+dark+"'/>"+
  extra+"</svg>");

const flowerArt = (petal, eye)=> svgUri(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 60'>"+
  "<path d='M20 58 V24' stroke='#6fa88e' stroke-width='4' stroke-linecap='round'/>"+
  "<path d='M20 44 q-11 -3 -13 -12 q11 1 13 12z' fill='#7fb59a'/>"+
  "<circle cx='20' cy='9' r='7' fill='"+petal+"'/>"+
  "<circle cx='11' cy='16' r='6' fill='"+petal+"'/>"+
  "<circle cx='29' cy='16' r='6' fill='"+petal+"'/>"+
  "<circle cx='14' cy='25' r='5.5' fill='"+petal+"'/>"+
  "<circle cx='26' cy='25' r='5.5' fill='"+petal+"'/>"+
  "<circle cx='20' cy='18' r='5' fill='"+eye+"'/>"+
  "</svg>");

/* One palette per season. Single source of truth: the inline SVG tree on the
   result screen AND the canvas tree on the saved share image both read from
   here, so the picture a student saves matches the one they were looking at. */
const TREE_TINTS = {
  blooming:{mid:'#7fb59a',light:'#93c4ab',dark:'#5c9a7d'},

/* ================================================================
   SCORING MODEL — 4 variables, each 0..1
   Each question maps to one theme. pos:true => options run
   struggling(0) -> thriving(3). Adjust mapping/weights freely.
   ================================================================ */
/* Options are written A(best) -> D(worst), i.e. index 0 = best.
   So value = 1 - index/3  (A=1.0, B=.67, C=.33, D=0).
   Q4 weather: calm(A)=best already maps to high "storms" score,
   where high storms = calm skies / low pressure. */
const QUESTIONS = [
  {theme:'sunlight', key:'sky'},      // Q1 sky     -> motivation / outlook
  {theme:'water',    key:'soil'},     // Q2 soil    -> rest & self-care
  {theme:'roots',    key:'roots'},    // Q3 roots   -> support system
  {theme:'storms',   key:'weather'},  // Q4 weather -> calm(high)=low pressure
  {theme:'sunlight', key:'flowers'},  // Q5 flowers -> accomplishment -> purpose
  {theme:'sunlight', key:'path'},     // Q6 path    -> hope / direction -> purpose
];
const answers = new Array(QUESTIONS.length).fill(null);

function scores(){
  const acc={}, cnt={};
  QUESTIONS.forEach((q,i)=>{
    if(answers[i]==null) return;
    const v = 1 - answers[i]/3;             // index 0 (A) = best = 1.0
    acc[q.theme]=(acc[q.theme]||0)+v; cnt[q.theme]=(cnt[q.theme]||0)+1;
  });
  const themes=['sunlight','water','roots','storms'];
  const out={};
  themes.forEach(t=> out[t] = cnt[t]? acc[t]/cnt[t] : 0.5 );
  return out;
}

/* Map the 4 scores -> Energy & Purpose axes -> one of 4 gardens.
   Energy  = rest, minus stress pressure, cushioned by support.
   Purpose = motivation/meaning (sunlight).
   Tweak thresholds here. */
function band(sc){
  // Energy  = how much you have left: rest (water) + calm skies (storms) + support cushion (roots)
  // Purpose = whether you still see meaning/goals: sunlight (motivation, flowers, path all feed sunlight)
  const energy  = sc.water*0.45 + sc.storms*0.35 + sc.roots*0.20;
  const purpose = sc.sunlight;
  // Blooming: plenty of energy AND clear purpose
  if(energy>=0.72 && purpose>=0.66) return 'blooming';
  // Growing: purpose still solid, energy dipping (tired but still sees meaning)
  if(purpose>=0.55)                 return 'growing';
  // Rainy: purpose fading but not gone, still some drive left
  if(purpose>=0.30)                 return 'rainy';
  // Autumn: low energy, low purpose
  return 'autumn';
}

/* Backgrounds now come off the CDN, so they arrive a moment after the screen
   does. Each scene paints BG_FALLBACK immediately and upgrades itself to the
   real image once it has loaded; a failed download simply keeps the gradient,
   so a blocked CDN degrades to a plain garden rather than a broken page.
   filename -> 'loading' | 'ok' | 'fail', so each image is fetched only once. */
const _bgState = {};
let _bgWanted = null;

function bgUrl(src){ return src.startsWith('url(') ? src : `url("${src}")`; }

function setBg(bg){
  const src = ASSETS.backgrounds[bg] || ASSETS.backgrounds.bg0;
  const app = $('bgLayer');
  _bgWanted = src;

  // gradient slot, or an already-resolved value (data:/http/url(...)) — paint as-is
  if(!src || src.startsWith('linear') || src.startsWith('radial')){
    app.style.backgroundImage = src || BG_FALLBACK; return;
  }
  if(src.startsWith('url(') || src.startsWith('data:') || src.startsWith('http')){
    app.style.backgroundImage = bgUrl(src); return;
  }

  // CDN filename
  const href = CDN + src;
  if(_bgState[src] === 'ok'){ app.style.backgroundImage = bgUrl(href); return; }

  app.style.backgroundImage = BG_FALLBACK;
  if(_bgState[src]) return;              // already loading, or already failed
  _bgState[src] = 'loading';
  const img = new Image();
  img.onload  = ()=>{ _bgState[src]='ok';
                      if(_bgWanted===src) app.style.backgroundImage = bgUrl(href); };
  img.onerror = ()=>{ _bgState[src]='fail'; };   // gradient stays
  img.src = href;
}

/* Warm the cache for every distinct background while the reader is still on the
   intro, so scene changes mid-walk don't flash the gradient. */
function preloadBackgrounds(){
  const seen = {};
  Object.values(ASSETS.backgrounds).forEach(src=>{
    if(!src || seen[src] || _bgState[src]) return;
    if(src.startsWith('linear')||src.startsWith('radial')||src.startsWith('url(')
       ||src.startsWith('data:')||src.startsWith('http')) return;
    seen[src]=1; _bgState[src]='loading';
    const img=new Image();
    img.onload =()=>{ _bgState[src]='ok'; };
    img.onerror=()=>{ _bgState[src]='fail'; };
    img.src=CDN+src;
  });
}

  if(step.type==='narr'){
    $('walkNarr').style.display='flex';
    $('walkQ').style.display='none';
    $('walkKeeper').src=KEEPER_IMG;
    $('walkBubble').textContent=L().narr[step.key] || '['+step.key+']';
    if(step.end){
      $('walkHint').style.display='none';
      $('walkReveal').style.display='inline-block';
      $('walkReveal').textContent=L().ui.reveal;
    }else{
      $('walkHint').style.display='block';
      $('walkHint').textContent=L().ui.tap;
      restartHint($('walkHint'), true);
      $('walkReveal').style.display='none';
    }
  }else{
    $('walkNarr').style.display='none';
    $('walkQ').style.display='block';
    renderQuestion(step.qi);
  }
}
function renderQuestion(qi){
  const t=L(); const q=t.q[qi];
  $('qKeeper').src=KEEPER_IMG;
  $('qPrompt').textContent=q.prompt;
  const box=$('qOpts'); box.innerHTML='';
  q.opts.forEach((o,idx)=>{
    const b=document.createElement('button');
    b.className='opt'+(answers[qi]===idx?' sel':'');
    b.textContent=o;
    b.onclick=()=>choose(idx);
    box.appendChild(b);
  });
}
function choose(v){
  const step=WALK[walkStep];
  if(step.type!=='q') return;
  answers[step.qi]=v;
  renderQuestion(step.qi); // show highlight
  setTimeout(()=>{ walkStep++; transition(()=>syncFromWalk()); },230);
}
function walkTap(){
  const step=WALK[walkStep];
  if(step && step.type==='narr' && !step.end){
    walkStep++; transition(()=>syncFromWalk());
  }
}

/* ---- result ---- */
function levelWord(v){
  // v is 0..1; returns a plain-language level word matching current language
  const words = lang==='th' ? {high:'สูง', mid:'ปานกลาง', low:'ต่ำ'} : {high:'High', mid:'Medium', low:'Low'};
  if(v>=0.66) return words.high;
  if(v>=0.34) return words.mid;
  return words.low;
}
function scoreLabel(v){ return Math.round(v*100)+' ('+levelWord(v)+')'; }

// NOTE: this is a light spam filter, not real security. It's visible to anyone
// who views this page's source, so it can't stop a determined bad actor —
// it only filters out generic/automated spam hitting the endpoint by accident.
// The Apps Script endpoint is inherently public (see doPost in Code.txt);
// this survey is low-stakes/anonymous so that tradeoff is acceptable.
const SUBMIT_TOKEN='gog-2026-sec11-wellbeing';
const SESSION_SENT_KEY='growth-of-garden:submitted';

function sendResultData(sc,g){
  let alreadySent=false;
  try{ alreadySent = sessionStorage.getItem(SESSION_SENT_KEY)==='1'; }
  catch(e){ /* sessionStorage blocked in this environment (e.g. sandboxed preview iframe) — proceed without the guard */ }

  if(alreadySent) return;
  const t=L();
  const bd=t.bands[g];
  const payload={
    token:SUBMIT_TOKEN,
    age:DEMO_CANON.age[demoAgeIdx]||'',
    year:DEMO_CANON.year[demoYearIdx]||'',
    gender:DEMO_CANON.gender[demoGenderIdx]||'',
    sunlight:scoreLabel(sc.sunlight),
    water:scoreLabel(sc.water),
    roots:scoreLabel(sc.roots),
    storms:scoreLabel(sc.storms),
    garden:bd.name+' / '+bd.sub,
    lang:lang.toUpperCase()
  };
  fetch(GSHEET_URL,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(payload)
  }).then(()=>{
    try{ sessionStorage.setItem(SESSION_SENT_KEY,'1'); }catch(e){ /* ignore if blocked — e.g. sandboxed preview iframe */ }
  }).catch(()=>{ /* best-effort submission; network failure is not user-facing */ });
}

/* ================================================================
   SAVE MY GARDEN  —  draws the result as a 1080x1920 share image
   Everything is drawn with canvas primitives rather than screenshotting
   the DOM, which keeps the no-dependency rule (no html2canvas) and gives
   a portrait card sized for a phone story rather than a cropped page.
   ================================================================ */
const SHARE_URL = 'hlyjezz.github.io/Growth-of-garden';
let _cardBg = null;   // CORS-clean copy of the backdrop, warmed at result time

/* A normal background load doesn't set crossOrigin, and a canvas drawn from
   that cached response would be tainted and refuse to export. The query string
   forces a separate, CORS-clean cache entry. */
function loadCorsImage(src){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.crossOrigin='anonymous';
    im.onload=()=>res(im);
    im.onerror=()=>rej(new Error('img'));
    im.src=src;
  });
}
function warmCardBackdrop(){
  if(_cardBg) return;
  const f=ASSETS.backgrounds.bg7;
  if(!f || /^(linear|radial|url\(|data:|http)/.test(f)) return;
  loadCorsImage(CDN+f+'?cors=1').then(im=>{_cardBg=im;}).catch(()=>{});
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

/* Thai runs have no spaces, so a word-only wrap would overflow. Try tokens
   first, then break a too-long token by character. */
function wrapText(c,text,maxW){
  const lines=[];
  String(text||'').split('\n').forEach(para=>{
    let line='';
    (para.match(/\S+\s*|\s+/g)||[]).forEach(tok=>{
      if(c.measureText(line+tok).width<=maxW){ line+=tok; return; }
      if(line.trim()){ lines.push(line.trim()); line=''; }
      if(c.measureText(tok).width<=maxW){ line=tok.replace(/^\s+/,''); return; }
      let cur='';
      for(const ch of tok){
        if(c.measureText(cur+ch).width>maxW && cur){ lines.push(cur); cur=ch; }
        else cur+=ch;
      }
      line=cur;
    });
    lines.push(line.trim());
  });
  return lines.filter((l,i,a)=>l!=='' || i<a.length-1);
}

function drawCardTree(c,cx,cy,s,tint){
  c.strokeStyle='#a9855f'; c.lineCap='round';
  c.lineWidth=12*s; c.beginPath(); c.moveTo(cx,cy+74*s); c.lineTo(cx,cy); c.stroke();
  c.lineWidth=7*s;
  c.beginPath(); c.moveTo(cx,cy+28*s); c.lineTo(cx-22*s,cy+8*s); c.stroke();
  c.beginPath(); c.moveTo(cx,cy+18*s); c.lineTo(cx+24*s,cy-2*s); c.stroke();
  const el=(ex,ey,rx,ry,f)=>{ c.fillStyle=f; c.beginPath(); c.ellipse(ex,ey,rx,ry,0,0,Math.PI*2); c.fill(); };
  el(cx,        cy-36*s, 54*s, 46*s, tint.mid);
  el(cx-26*s,   cy-20*s, 27*s, 23*s, tint.light);
  el(cx+28*s,   cy-24*s, 25*s, 21*s, tint.dark);
}

function buildGardenCard(){
  const W=1080,H=1920;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  const t=L(), sc=scores(), g=forcedBand||band(sc), bd=t.bands[g];
  const face = lang==='th' ? "'Mali',sans-serif" : "'Quicksand',sans-serif";

  // backdrop, or the same gradient the app falls back to
  if(_cardBg){
    const r=Math.max(W/_cardBg.width,H/_cardBg.height);
    const w=_cardBg.width*r, h=_cardBg.height*r;
    c.drawImage(_cardBg,(W-w)/2,(H-h)/2,w,h);
  }else{
    const gr=c.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'#cfe3ea'); gr.addColorStop(.55,'#e3e9d6'); gr.addColorStop(1,'#f2ead9');
    c.fillStyle=gr; c.fillRect(0,0,W,H);
  }
  c.fillStyle='rgba(247,244,238,.40)'; c.fillRect(0,0,W,H);

  // panel
  c.fillStyle='rgba(255,255,255,.74)';
  roundRect(c,64,150,W-128,1560,54); c.fill();

  c.textAlign='center'; c.fillStyle='#3a4a42';

  c.font='600 62px '+face;
  c.fillText(bd.name, W/2, 300);
  c.font='400 34px '+face; c.fillStyle='#5f7168';
  c.fillText(bd.sub, W/2, 362);

  drawCardTree(c, W/2, 590, 2.0, TREE_TINTS[g]);

  // score bars
  const rows=[['sunlight','#f2c265'],['water','#8fb4d4'],['roots','#5c9a7d'],['storms','#cf9b5f']];
  let y=830;
  rows.forEach(([k,col])=>{
    c.textAlign='left'; c.font='500 32px '+face; c.fillStyle='#3a4a42';
    c.fillText(t.scoreLabels[k], 140, y);
    c.textAlign='right'; c.fillStyle='#5f7168';
    c.fillText(Math.round(sc[k]*100)+'', W-140, y);
    c.fillStyle='rgba(0,0,0,.07)'; roundRect(c,140,y+18,W-280,24,12); c.fill();
    c.fillStyle=col; roundRect(c,140,y+18,Math.max(24,(W-280)*sc[k]),24,12); c.fill();
    y+=112;
  });

  // Bam's quote
  if(bd.quote){
    c.textAlign='center'; c.font='500 36px '+face; c.fillStyle='#5c9a7d';
    let qy=y+70;
    wrapText(c,bd.quote,W-260).forEach(l=>{ c.fillText(l,W/2,qy); qy+=52; });
  }

  // footer
  c.textAlign='center'; c.font='400 26px '+face; c.fillStyle='#8a9990';
  c.fillText(lang==='th'?'สวนของเรา · Growth of Garden':'Growth of Garden · สวนของเรา', W/2, 1640);
  c.fillText(SHARE_URL, W/2, 1682);
  return cv;
}

async function saveResultImage(){
  const btn=$('saveBtn'), orig=btn.textContent;
  btn.disabled=true;
  btn.textContent = lang==='th' ? 'กำลังบันทึก…' : 'Saving…';
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const cv=buildGardenCard();
    const blob=await new Promise((res,rej)=>{
      try{ cv.toBlob(b=> b?res(b):rej(new Error('toBlob')), 'image/png'); }catch(e){ rej(e); }
    });
    const file=new File([blob],'my-garden.png',{type:'image/png'});

    // On iOS this opens the share sheet, so it can go to Photos or a story.
    let handled=false;
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); handled=true; }
      catch(e){ if(e && e.name==='AbortError') handled=true; }   // cancelled on purpose
    }
    if(!handled){
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='my-garden.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),15000);
    }
  }catch(e){
    alert(lang==='th'
      ? 'บันทึกรูปไม่สำเร็จ ลองแคปหน้าจอแทนได้นะ'
      : "Couldn't save the image — a screenshot works too.");
  }finally{
    btn.disabled=false; btn.textContent=orig;
  }
}

function renderResult(){
  const t=L();
  const sc=scores();
  const g = forcedBand || band(sc);
  const bd=t.bands[g];

  if(consented && !hasSentResult){ sendResultData(sc,g); hasSentResult=true; }
  warmCardBackdrop();   // fetch the CORS-clean backdrop now, so saving feels instant

  $('rTitle').textContent=bd.name;
  $('rSub').textContent=bd.sub;
  $('rSummary').textContent=bd.summary;
  $('rQuote').textContent=bd.quote||'';

  // scene
  const scene=$('rScene'); scene.innerHTML='';
  const soil=document.createElement('img'); soil.className='soil'; soil.src=ASSETS.soil; scene.appendChild(soil);
  const tree=document.createElement('img'); tree.className='tree'; tree.src=ART.tree[g]; scene.appendChild(tree);
  const fkeys=Object.keys(ART.flower);
  const nFl = g==='blooming'?3 : g==='growing'?2 : g==='rainy'?1 : 0;
  for(let i=0;i<nFl;i++){
    const f=document.createElement('img'); f.className='fl'; f.src=ART.flower[fkeys[i%fkeys.length]];
    f.style.left=(20+i*28)+'%'; f.style.animationDelay=(i*0.4)+'s';
    scene.appendChild(f);
  }

  // characteristics
  $('rCharLabel').textContent=t.ui.charLabel;
  const ul=$('rChar'); ul.innerHTML='';
  bd.char.forEach(c=>{const li=document.createElement('li');li.textContent=c;ul.appendChild(li);});

  // key message
  $('rKeyLabel').textContent=t.ui.keyLabel;
  $('rKey').textContent=bd.key;

  // bars
  const bars=$('rBars'); bars.innerHTML='';
  const colors={sunlight:'var(--sun)',water:'var(--rain)',roots:'var(--accent-deep)',storms:'var(--autumn)'};
  ['sunlight','water','roots','storms'].forEach(k=>{
    const row=document.createElement('div'); row.className='bar-row';
    row.innerHTML=`<div class="bar-top"><span>${t.scoreLabels[k]}</span></div>
      <div class="bar-track"><div class="bar-fill" style="background:${colors[k]}"></div></div>`;
    bars.appendChild(row);
    requestAnimationFrame(()=>{ row.querySelector('.bar-fill').style.width=Math.round(sc[k]*100)+'%'; });
  });

  // conditional support box
  const showSup = (g==='rainy'||g==='autumn');
  $('rSupport').style.display = showSup?'block':'none';
  if(showSup){ $('rSupportLabel').textContent=t.ui.supportLabel; $('rSupportText').textContent=(bd.bridge?bd.bridge+'\n\n':'')+t.support; }

  $('saveBtn').textContent=t.ui.save;
  $('restartBtn').textContent=t.ui.restart;
  $('rDisclaimer').textContent=t.ui.disclaimer;

  // scroll hint
  const sh=$('scrollHint'); sh.style.opacity='1';
  $('result').onscroll=()=>{ if($('result').scrollTop>40) sh.style.opacity='0'; };
}

/* ---- consent ---- */
function renderConsent(){
  const t=L();
  $('consentTitle').textContent=t.consent.title;
  const ul=$('consentList'); ul.innerHTML='';
  t.consent.points.forEach(p=>{const li=document.createElement('li');li.textContent=p;ul.appendChild(li);});
  $('consentAgree').textContent=t.consent.agree;
  $('consentDecline').textContent=t.consent.decline;
}
function goConsent(){ stage='consent'; transition(()=>{setProgress(false);renderConsent();show('consent');}); }
function consentAndContinue(agree){
  consented=agree;
  goStory();
}

/* ---- demographics (only shown if consent was given) ---- */
function renderDemo(){
  const t=L().demo;
  $('demoTitle').textContent=t.title;
  $('demoAgeLabel').textContent=t.age;
  $('demoYearLabel').textContent=t.year;
  $('demoGenderLabel').textContent=t.gender;
  buildDemoOpts('demoAgeOpts', t.ageOpts, demoAgeIdx, i=>{demoAgeIdx=i; renderDemo();});
  buildDemoOpts('demoYearOpts', t.yearOpts, demoYearIdx, i=>{demoYearIdx=i; renderDemo();});
  buildDemoOpts('demoGenderOpts', t.genderOpts, demoGenderIdx, i=>{demoGenderIdx=i; renderDemo();});
  $('demoContinue').textContent=t.cont;
  $('demoContinue').disabled = !(demoAgeIdx!==null && demoYearIdx!==null && demoGenderIdx!==null);
  $('demoContinue').style.opacity = $('demoContinue').disabled ? '.5' : '1';
}
function buildDemoOpts(containerId, opts, currentIdx, onPick){
  const box=$(containerId); box.innerHTML='';
  opts.forEach((label,idx)=>{
    const b=document.createElement('button');
    b.className='demo-opt'+(currentIdx===idx?' sel':'');
    b.textContent=label;
    b.onclick=()=>onPick(idx);
    box.appendChild(b);
  });
}
function goDemo(){ stage='demo'; transition(()=>{setProgress(false);renderDemo();show('demo');}); }

/* ---- flow control ---- */
function begin(){ goConsent(); }
function goStory(){ stage='story'; storyStep=0; transition(()=>{setProgress(false);renderStory();show('story');}); }
function startWalk(){ stage='walk'; walkStep=0; $('langBtn').style.display='none'; $('muteBtn').style.display='none'; transition(()=>{syncFromWalk();}); }
function restart(){
  answers.fill(null); walkStep=0; storyStep=0; consented=false; hasSentResult=false; demoAgeIdx=null; demoYearIdx=null; demoGenderIdx=null; stage='intro'; $('langBtn').style.display='';
  // Music deliberately survives a restart — it used to stop and start over from
  // the top, which made "start over" feel like a page reload. The reader's mute
  // choice is kept too.
  if(musicStarted) $('muteBtn').style.display=''; else $('muteBtn').style.display='none';
  paintMuteBtn();
  transition(()=>{renderIntro();show('intro');});
}

/* ---- language ---- */
function toggleLang(){
  lang = lang==='th'?'en':'th';
  document.documentElement.lang=lang;
  document.body.classList.toggle('en', lang==='en');
  $('langBtn').textContent=L().ui.lang;
  paintMuteBtn();               // its aria-label is language-dependent
  // re-render current stage
  if(stage==='intro') renderIntro();
  else if(stage==='story') renderStory();
  else if(stage==='consent') renderConsent();
  else if(stage==='demo') renderDemo();
  else if(stage==='walk') renderWalk();
  else if(stage==='result') renderResult();
}

/* ---- music ----
   The track streams from the CDN now, so it can't start the instant it's asked
   for. The element is built and told to buffer as soon as the reader opens the
   story, and only actually plays at storyStep 2 (right after the sound-on tip),
   which keeps that timing exactly as designed while hiding the download.
   If the track can't be fetched at all, the mute button hides itself rather
   than sitting there controlling nothing. */
let audio=null, muted=false, musicStarted=false;

function ensureAudio(){
  if(audio || !MUSIC_SRC) return audio;
  audio=new Audio();
  audio.loop=true; audio.volume=0.45; audio.preload='auto';
  audio.addEventListener('error', ()=>{ $('muteBtn').style.display='none'; });
  audio.src=MUSIC_SRC;
  return audio;
}
/* Start buffering, without making a sound.
   load() ABORTS playback and resets the element, so it must never run once the
   track is already going — that silently killed the music at the consent page. */
function preloadMusic(){
  const a=ensureAudio();
  if(a && !musicStarted) a.load();
}

/* Music should begin on the very first page. Browsers block audio until the
   reader has interacted, so the earliest it can legally start is their first
   tap anywhere — which on the intro screen is the "enter the garden" button.
   We arm a one-shot listener at load; whichever gesture comes first wins. */
function armMusicOnFirstTap(){
  const go=()=>{
    initAudio();
    document.removeEventListener('pointerdown',go,true);
    document.removeEventListener('keydown',go,true);
  };
  document.addEventListener('pointerdown',go,true);
  document.addEventListener('keydown',go,true);
}

function initAudio(){
  if(musicStarted) return;
  const a=ensureAudio(); if(!a) return;
  musicStarted=true;
  if(!muted) a.play().catch(()=>{});
  $('muteBtn').style.display='';
}
/* Drawn speaker icons rather than 🔊/🔇 — emoji render as glossy platform art
   on iOS and clash with everything else on screen. */
const ICON_SOUND = "<svg viewBox='0 0 24 24' width='16' height='16' fill='none' stroke='currentColor'"+
  " stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>"+
  "<path d='M11 5 6 9H3v6h3l5 4z'/><path d='M15.5 8.8a4.5 4.5 0 0 1 0 6.4'/>"+
  "<path d='M18.6 5.7a9 9 0 0 1 0 12.6'/></svg>";
const ICON_MUTED = "<svg viewBox='0 0 24 24' width='16' height='16' fill='none' stroke='currentColor'"+
  " stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>"+
  "<path d='M11 5 6 9H3v6h3l5 4z'/><path d='m16 9.5 5 5M21 9.5l-5 5'/></svg>";

function paintMuteBtn(){
  const b=$('muteBtn');
  b.innerHTML = muted ? ICON_MUTED : ICON_SOUND;
  b.setAttribute('aria-label', muted
    ? (lang==='th' ? 'เปิดเสียง' : 'Unmute')
    : (lang==='th' ? 'ปิดเสียง' : 'Mute'));
}

function toggleMute(){
  muted=!muted;
  if(audio){ if(muted) audio.pause(); else audio.play().catch(()=>{}); }
  paintMuteBtn();
}

/* ---- ambient drifting petals ---- */
function spawnPetals(){
  const host=$('ambient');
  const tints=['#7fb59a','#5c9a7d','#e79bb4','#cf9b5f','#f2c265'];
  for(let i=0;i<11;i++){
    const fall=document.createElement('div'); fall.className='petal';
    fall.style.left=Math.random()*100+'%';
    fall.style.animationDuration=(11+Math.random()*9)+'s';
    // negative delay starts each petal mid-flight, so they're already spread
    // down the screen on load instead of arriving in one batch from the top
    fall.style.animationDelay=(-Math.random()*14)+'s';

    const sway=document.createElement('div'); sway.className='sway';
    sway.style.animationDuration=(2.6+Math.random()*2.4)+'s';
    sway.style.animationDelay=(-Math.random()*3)+'s';

    const shape=document.createElement('div'); shape.className='shape';
    const w=7+Math.random()*7;
    shape.style.width=w+'px';
    shape.style.height=(w*(1.25+Math.random()*0.5))+'px';
    shape.style.background=tints[i%tints.length];
    shape.style.opacity=(0.38+Math.random()*0.3).toFixed(2);

    sway.appendChild(shape); fall.appendChild(sway); host.appendChild(fall);
  }
}

/* ================================================================
   WIRE UP
   ================================================================ */
window.addEventListener('DOMContentLoaded',()=>{
  renderIntro(); show('intro'); spawnPetals(); preloadBackgrounds(); paintMuteBtn();
  preloadMusic(); armMusicOnFirstTap();   // music now begins on the first page
  $('langBtn').textContent=L().ui.lang;

  $('startBtn').onclick=()=>{ begin(); };
  $('storyBegin').onclick=()=>{ if(consented) goDemo(); else startWalk(); };
  $('consentAgree').onclick=()=>consentAndContinue(true);
  $('consentDecline').onclick=()=>consentAndContinue(false);
  $('demoContinue').onclick=()=>{ if(demoAgeIdx!==null&&demoYearIdx!==null&&demoGenderIdx!==null) startWalk(); };
  $('walkReveal').onclick=()=>{ walkStep++; transition(()=>syncFromWalk()); };
  $('saveBtn').onclick=saveResultImage;
  $('restartBtn').onclick=restart;
  $('langBtn').onclick=toggleLang;
  $('muteBtn').onclick=toggleMute;

  // tap-to-advance for story + walk narration
  $('story').addEventListener('click',e=>{ if(e.target.id==='storyBegin')return; storyTap(); });
  $('walk').addEventListener('click',e=>{
    if(e.target.closest('.opt')||e.target.id==='walkReveal')return;
    if(WALK[walkStep] && WALK[walkStep].type==='narr') walkTap();
  });
});
</script>
